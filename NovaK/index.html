<select
id="trackingType"
onchange="updateMeasurementFields()"

<option value="percentage">Percentage</option>
<option value="quantity">Quantity</option>
<option value="custom">Custom Measurement</option>


<input
id="itemContainer"
type="text"
placeholder="Example: bag, box, jar, jug"

<label>
    Current Percentage
</label>

<input
    id="itemCurrentPercentage"
    type="number"
    min="0"
    max="100"
    value="100"
    placeholder="100"
>

<label>
    Shopping Threshold %
</label>

<input
    id="itemThresholdPercentage"
    type="number"
    min="0"
    max="100"
    value="25"
    placeholder="25"
>

<label>
    Current Quantity
</label>

<input
    id="itemCurrentQuantity"
    type="number"
    min="0"
    step="0.5"
    value="1"
>

<label>
    Maximum Quantity
</label>

<input
    id="itemMaxQuantity"
    type="number"
    min="0"
    step="0.5"
    value="10"
>

<label>
    Shopping Threshold
</label>

<input
    id="itemThresholdQuantity"
    type="number"
    min="0"
    step="0.5"
    value="3"
>

<label>
    Current Measurement
</label>

<input
    id="itemCustomCurrent"
    type="text"
    placeholder="Example: 1.5 bags"
>

<label>
    Maximum Measurement
</label>

<input
    id="itemCustomMax"
    type="text"
    placeholder="Example: 3 bags"
>

<label>
    Shopping Threshold
</label>

<input
    id="itemCustomThreshold"
    type="text"
    placeholder="Example: 0.5 bags"
>
